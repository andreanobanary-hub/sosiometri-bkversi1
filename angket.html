<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Angket Sosiometri Siswa</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen p-4 flex items-center justify-center">
  <div class="bg-white max-w-md w-full rounded-2xl shadow-md p-6 border border-slate-200">
    <div class="text-center mb-6">
      <h2 class="text-xl font-bold text-slate-800">Angket Hubungan Sosial</h2>
      <p class="text-xs text-slate-500 mt-1">Pilihlah teman yang paling nyaman untuk belajar kelompok bersama.</p>
    </div>

    <form id="formSosiometri" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-slate-700">Nama Kamu</label>
        <select id="pemilih" required class="w-full mt-1 p-2.5 border rounded-lg bg-slate-50 border-slate-300 text-sm">
          <option value="">-- Pilih Namamu --</option>
          <option value="1">Ahmad (L)</option>
          <option value="2">Budi (L)</option>
          <option value="3">Citra (P)</option>
          <option value="4">Dewi (P)</option>
        </select>
      </div>

      <div class="border-t pt-3">
        <label class="block text-sm font-semibold text-emerald-700">Pilihan 1 (Prioritas Utama)</label>
        <select id="p1" required class="w-full mt-1 p-2.5 border rounded-lg bg-emerald-50 border-emerald-300 text-sm">
          <option value="">-- Pilih Teman Pilihan 1 --</option>
          <option value="1">Ahmad</option>
          <option value="2">Budi</option>
          <option value="3">Citra</option>
          <option value="4">Dewi</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-blue-700">Pilihan 2</label>
        <select id="p2" required class="w-full mt-1 p-2.5 border rounded-lg bg-blue-50 border-blue-300 text-sm">
          <option value="">-- Pilih Teman Pilihan 2 --</option>
          <option value="1">Ahmad</option>
          <option value="2">Budi</option>
          <option value="3">Citra</option>
          <option value="4">Dewi</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold text-amber-700">Pilihan 3</label>
        <select id="p3" class="w-full mt-1 p-2.5 border rounded-lg bg-amber-50 border-amber-300 text-sm">
          <option value="">-- Pilih Teman Pilihan 3 (Opsional) --</option>
          <option value="1">Ahmad</option>
          <option value="2">Budi</option>
          <option value="3">Citra</option>
          <option value="4">Dewi</option>
        </select>
      </div>

      <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg shadow transition text-sm">
        Kirim Pilihan
      </button>
    </form>
  </div>

  <script>
    // URL Web App GAS yang bertindak sebagai backend
    const SCRIPT_URL = "GANTI_DENGAN_URL_EXEC_GOOGLE_APPS_SCRIPT";

    document.getElementById('formSosiometri').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const payload = {
        pemilih: document.getElementById('pemilih').value,
        p1: document.getElementById('p1').value,
        p2: document.getElementById('p2').value,
        p3: document.getElementById('p3').value
      };

      if (payload.pemilih === payload.p1 || payload.pemilih === payload.p2 || payload.pemilih === payload.p3) {
        alert("Kamu tidak boleh memilih diri sendiri!");
        return;
      }

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).then(() => {
        alert("Pilihan sosiometri kamu berhasil disimpan. Terima kasih!");
        document.getElementById('formSosiometri').reset();
      }).catch(err => {
        alert("Terjadi kesalahan koneksi.");
      });
    });
  </script>
</body>
</html>
